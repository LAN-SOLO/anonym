[package]
name = "anonym-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "anonym core: rule-based PII detection, consistent pseudonyms, format readers/writers (text, CSV, DOCX, XLSX, ODF)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
chacha20poly1305 = "0.10"
argon2 = "0.5"
base64 = "0.22"
